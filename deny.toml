[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8
unused-allowed-license = "deny"

[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[[licenses.exceptions]]
crate = "aws-lc-rs"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "aws-lc-sys"
allow = ["ISC", "BSD-3-Clause"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
