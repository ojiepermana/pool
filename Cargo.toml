[workspace]
resolver = "3"
members = ["apps/pool", "crates/pool-config", "crates/pool-control"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
pool-config = { path = "crates/pool-config" }
pool-control = { path = "crates/pool-control" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
