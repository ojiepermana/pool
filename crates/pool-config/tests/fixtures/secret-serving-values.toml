config_version = 1

[control]
state_directory = "/var/lib/pool"
authority_id = "0123456789abcdef0123456789abcdef"

[listener]
host = "CANARY-9f2c7b1e"
port = 6432
tls_certificate_file = "/etc/pool/tls/CANARY-9f2c7b1e.crt"
tls_private_key_file = "/etc/pool/tls/CANARY-9f2c7b1e.key"

[[cluster]]
id = "main"
system_identifier = "7412345678901234567"
expected_writer = "pg1"
monitor_login = "CANARY-9f2c7b1e-login"
monitor_database = "CANARY-9f2c7b1e-db"
monitor_credential_file = "/etc/pool/secrets/CANARY-9f2c7b1e"

[[node]]
id = "pg1"
cluster = "main"
host = "10.0.0.11"
port = 5432
tls_ca_file = "/etc/pool/tls/CANARY-9f2c7b1e-ca.crt"

[[node]]
id = "pg2"
cluster = "main"
host = "10.0.0.12"
port = 5432
tls_ca_file = "/etc/pool/tls/CANARY-9f2c7b1e-ca.crt"

[[node]]
id = "pg3"
cluster = "main"
host = "pg3.db.internal"
port = 5433
tls_ca_file = "/etc/pool/tls/CANARY-9f2c7b1e-ca.crt"
tls_server_name = "CANARY-9f2c7b1e.example.internal"

[[identity]]
id = "orders-app"
principal = "CANARY-9f2c7b1e-orders"
database = "orders"
cluster = "main"
backend_login = "orders_rw"
credential_file = "/etc/pool/secrets/orders_rw"

[[identity]]
id = "report-app"
principal = "CANARY-9f2c7b1e-report"
database = "orders"
cluster = "main"
backend_database = "orders_reporting"
backend_login = "report_ro"
credential_file = "/etc/pool/secrets/report_ro"
routing_profile = "primary"

[[principal]]
id = "orders-app"
name = "CANARY-9f2c7b1e-orders"
verifier_file = "/etc/pool/secrets/CANARY-9f2c7b1e-orders.scram"

[[principal]]
id = "report-app"
name = "CANARY-9f2c7b1e-report"
verifier_file = "/etc/pool/secrets/CANARY-9f2c7b1e-report.scram"
